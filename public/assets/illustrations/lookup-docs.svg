<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- Minh hoạ tra cứu: tài liệu + kính lúp + dấu hỏi. Chỉ xanh/trắng (đồng bộ bộ minh hoạ đăng nhập). -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce9fb"/></linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#c3d9f7"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa2ff"/><stop offset="1" stop-color="#1559c0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#cfe2fb" stop-opacity=".75"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#06275c" flood-opacity=".28"/></filter>
  </defs>
  <ellipse cx="170" cy="214" rx="120" ry="12" fill="#06275c" opacity=".18"/>
  <g filter="url(#sh)">
    <rect x="58" y="44" width="118" height="150" rx="14" fill="url(#paper2)" transform="rotate(-8 117 119)"/>
    <rect x="92" y="30" width="124" height="160" rx="14" fill="url(#paper)"/>
    <rect x="108" y="52" width="56" height="10" rx="5" fill="url(#blue)"/>
    <rect x="108" y="74" width="92" height="7" rx="3.5" fill="#b9d3f5"/>
    <rect x="108" y="90" width="80" height="7" rx="3.5" fill="#b9d3f5"/>
    <rect x="108" y="106" width="88" height="7" rx="3.5" fill="#b9d3f5"/>
    <rect x="108" y="122" width="60" height="7" rx="3.5" fill="#b9d3f5"/>
    <rect x="108" y="146" width="40" height="22" rx="6" fill="#e3eefc"/>
    <path d="M115 157l5 5 10-10" stroke="#1f6fd8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#sh)">
