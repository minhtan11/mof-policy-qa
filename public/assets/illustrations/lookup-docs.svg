    <circle cx="262" cy="64" r="30" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
    <path d="M252 56a10 10 0 1 1 14 9c-3 1.5-4 3.5-4 6.5" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="262" cy="81" r="3.4" fill="#ffffff"/>
  </g>
  <circle cx="60" cy="40" r="5" fill="#ffffff" opacity=".7"/>
  <circle cx="300" cy="140" r="4" fill="#ffffff" opacity=".6"/>
  <circle cx="40" cy="170" r="3" fill="#ffffff" opacity=".5"/>
